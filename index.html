<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="%BASE_URL%favicon.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Estimativa auditável de verbas rescisórias CLT — uso interno Êxito Contábil."
    />
    <title>Simulador de Rescisão CLT — Êxito Contábil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      /*
       * Resolve o tema antes da primeira pintura. Sem isto, o documento pinta
       * no tema padrão e só troca quando o React monta — o usuário vê o flash.
       * Espelha `lerTemaSalvo()` em src/ui/tema/useTema.ts; ao mudar a chave ou
       * o atributo em um dos dois lados, mude no outro.
       */
      (function () {
        try {
          var salvo = localStorage.getItem('exito:tema');
          var tema =
            salvo === 'claro' || salvo === 'escuro'
              ? salvo
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'claro'
                : 'escuro';
          document.documentElement.dataset.tema = tema;
        } catch (erro) {
          /* Modo privativo pode bloquear localStorage: cai no escuro padrão. */
          document.documentElement.dataset.tema = 'escuro';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
